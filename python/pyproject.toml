[project]
name = "openhead"
version = "0.1.0.dev0"
description = "Use a phone as a robot head: Python client, simulator and MCP server for the OpenHead protocol."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.7",
    "websockets>=14",
    "zeroconf>=0.136",
    "pyyaml>=6",
]

[project.optional-dependencies]
# Desktop simulator: renders face/dist in Chromium (headless or windowed) via Playwright.
sim = [
    "playwright>=1.50",
    "jsonschema>=4.23",
    "pillow>=10",
]
mcp = [
    "mcp>=2.3",
]

[project.scripts]
openhead = "openhead.cli.main:main"

[dependency-groups]
dev = [
    "openhead[sim,mcp]",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "jsonschema>=4.23",
    "referencing>=0.35",
    "datamodel-code-generator>=0.26",
    "json-schema-for-humans>=1.0",
    "pre-commit>=4",
    "ruff>=0.6",
    "black>=26.10.1",
    "isort>=8.0.1",
    "pyjwt[crypto]>=2.8",
    "httpx>=0.27",
    "cryptography>=43",
    "pytest-timeout>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openhead"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 120

[tool.ruff]
line-length = 100
extend-exclude = ["src/openhead/protocol/models.py", "src/openhead/protocol/registry.py"]

[tool.ruff.lint.isort]
# The pre-commit hook runs from the repository root; keep import grouping the same there.
known-first-party = ["openhead"]
