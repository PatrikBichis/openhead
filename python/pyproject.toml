[project]
name = "openhead"
version = "0.1.0.dev0"
description = "Use a phone as a robot head: Python client, simulator and MCP server for the OpenHead protocol."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.7",
    "websockets>=13",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "jsonschema>=4.23",
    "referencing>=0.35",
    "datamodel-code-generator>=0.26",
    "json-schema-for-humans>=1.0",
    "pre-commit>=4",
    "ruff>=0.6",
    "black>=26.10.1",
    "isort>=8.0.1",
    "pyjwt[crypto]>=2.8",
    "httpx>=0.27",
    "cryptography>=43",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openhead"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["src/openhead/protocol/models.py", "src/openhead/protocol/registry.py"]
