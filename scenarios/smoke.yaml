# Smoke test for any head: simulator (level 1) or device on the desk (level 2).
#   openhead run scenarios/smoke.yaml --device localhost
name: smoke
steps:
  - set_theme: cartoon
  - set_emotion: { name: happy, intensity: 1.0 }
  - wait_ms: 600
  - screenshot: cartoon-happy.png
  - expect_status: { theme: cartoon, emotion: happy, view: face }

  - set_theme: halloween
  - set_emotion: { name: scared, intensity: 1.0 }
  - wait_ms: 600
  - screenshot: halloween-scared.png
  - expect_log: { level: info, contains: "theme=halloween" }
  - expect_status: { theme: halloween, emotion: scared }

  - set_emotion: cackle
  - envelope: { level: [0.2, 0.8, 0.5, 0.9], duration_ms: 800 }
  - look_at: { frame: screen, x: 0.6, y: 0.2 }
  - blink

  - show_image: { source: assets/test-card.png, overlay: face-corner }
  - wait_ms: 300
  - screenshot: image-face-corner.png
  - expect_status: { view: image, overlay: face-corner }
  - show_face
  - expect_status: { view: face, overlay: none }

  - set_theme: cartoon
  - set_emotion: neutral
  - look_at: { frame: screen, x: 0, y: 0 }
  - wait_ms: 600
  - screenshot: cartoon-neutral.png
