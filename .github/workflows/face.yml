name: face

on:
  push:
    branches: [main]
    paths:
      - "face/**"
      - "protocol/schema/theme.schema.json"
      - "protocol/schema/expressions.schema.json"
      - "protocol/schema/common.json"
      - ".github/workflows/face.yml"
  pull_request:
    paths:
      - "face/**"
      - "protocol/schema/theme.schema.json"
      - "protocol/schema/expressions.schema.json"
      - "protocol/schema/common.json"
      - ".github/workflows/face.yml"
  workflow_dispatch:

concurrency:
  group: face-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: face
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: face/package-lock.json

      - run: npm ci

      - name: Build (generates theme types, typechecks)
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Golden images and engine API tests
        run: npm test

      - name: Gallery of every theme and expression
        if: always()
        run: npm run gallery

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: face-results
          path: |
            face/test-results/
            face/playwright-report/
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: face-dist
          path: face/dist/
          retention-days: 14
