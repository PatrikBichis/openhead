name: ios-testflight

# The only workflow: build the iOS app and upload it to TestFlight. Started by hand
# (gh workflow run ios-testflight.yml); all testing happens locally (tools/check.py).
# upload=false compiles without signing, to check Swift changes cheaply.
on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Sign and upload to TestFlight (false: unsigned compile check only)"
        type: boolean
        default: true

concurrency:
  group: ios-testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    # Apple requires the iOS 26 SDK (Xcode 26) for uploads from April 2026.
    runs-on: macos-26
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Select the newest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: face/package-lock.json

      - name: Build the face engine into the app bundle
        run: |
          cd face
          npm ci
          npm run build
          rm -rf ../apps/ios/OpenHead/Resources/face
          cp -R dist ../apps/ios/OpenHead/Resources/face

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd apps/ios
          xcodegen generate

      - name: Compile (unsigned)
        if: ${{ !inputs.upload }}
        run: |
          set -o pipefail
          xcodebuild build -project apps/ios/OpenHead.xcodeproj -scheme OpenHead \
            -configuration Release -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO | xcbeautify --renderer github-actions

      - name: Install signing certificate, profile and API key
        if: ${{ inputs.upload }}
        env:
          CERT_P12_B64: ${{ secrets.APPLE_DIST_CERT_P12_B64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
          PROFILE_B64: ${{ secrets.APPLE_PROVISIONING_PROFILE_B64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo "$CERT_P12_B64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          echo "$PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          UUID=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract UUID raw -)
          for DIR in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                     "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$DIR"
            cp "$RUNNER_TEMP/profile.mobileprovision" "$DIR/$UUID.mobileprovision"
          done

          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Archive (signed)
        if: ${{ inputs.upload }}
        env:
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          xcodebuild archive -project apps/ios/OpenHead.xcodeproj -scheme OpenHead \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/OpenHead.xcarchive" \
            MARKETING_VERSION="$(cat protocol/VERSION)" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="OpenHead App Store" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN" | xcbeautify --renderer github-actions

      - name: Export and upload to TestFlight
        if: ${{ inputs.upload }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          # Uploads straight to App Store Connect (ExportOptions destination=upload); does not
          # wait for Apple's processing, which would only burn macOS minutes.
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/OpenHead.xcarchive" \
            -exportOptionsPlist apps/ios/ExportOptions.plist -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          {
            echo "### Uploaded to TestFlight"
            echo "- Version: $(cat protocol/VERSION) (${{ github.run_number }})"
            echo "- Commit: ${{ github.sha }}"
            echo "- Follow processing locally: \`uv run --project python python tools/testflight_status.py\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing material
        if: ${{ always() && inputs.upload }}
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -rf "$RUNNER_TEMP/keys" "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/profile.mobileprovision"
