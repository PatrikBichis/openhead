# XcodeGen spec for the OpenHead iOS app. Generated project files are not committed;
# ios-testflight.yml builds face/dist, copies it to OpenHead/Resources/face and runs xcodegen.
name: OpenHead
options:
  bundleIdPrefix: se.bichis
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0" # overridden from protocol/VERSION in CI
    CURRENT_PROJECT_VERSION: "1" # overridden with the run number in CI
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: GJX3M68CH3
targets:
  OpenHead:
    type: application
    platform: iOS
    sources:
      - path: OpenHead
        excludes:
          - "Resources/face/**"
          - "Info.plist"
      - path: OpenHead/Resources/face
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.bichis.openhead
        PRODUCT_NAME: OpenHead
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic # CI switches to manual signing
        ENABLE_PREVIEWS: NO
    info:
      path: OpenHead/Info.plist
      properties:
        CFBundleDisplayName: OpenHead
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # The phone is mounted in landscape on the robot.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: OpenHead shows what the head sees and finds faces so the robot can look at people. Camera images stay on this device.
        NSLocationWhenInUseUsageDescription: OpenHead tells the robot where the head is when the robot asks for it (the gps stream). The location goes only to robot controllers paired on your network.
        NSMotionUsageDescription: OpenHead reads the barometer (air pressure and altitude change) when the robot asks for it. The data goes only to robot controllers paired on your network.
        NSLocalNetworkUsageDescription: OpenHead lets robot controllers on your network connect to this head.
        NSMicrophoneUsageDescription: OpenHead listens when the robot asks it to (speech.listen) and turns what you say into text. Audio stays on this device; only the text goes to robot controllers paired on your network.
        NSSpeechRecognitionUsageDescription: OpenHead turns what you say into text, on this device when it can, and sends the text only to robot controllers paired on your network.
        NSBonjourServices:
          - _openhead._tcp
        # Images, video and web pages come from the robot's computer on the LAN, often over
        # plain http (openhead MediaServer); only the face's web views load them.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
    scheme: {}
