<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>OpenHead face</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      html {
        background: transparent;
      }
      body {
        background: #000;
      }
      #face {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      /* display.show: image, video or web page; the face hides or moves to a corner */
      #display {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
      }
      #display[hidden] {
        display: none;
      }
      #display img,
      #display video,
      #display canvas.frame,
      #display canvas.synthetic-camera {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      #display canvas.frame {
        position: absolute;
        inset: 0;
      }
      #display iframe {
        border: 0;
        width: 100%;
        height: 100%;
        background: #fff;
      }
      body.showing:not(.face-corner) #face {
        visibility: hidden;
      }
      /* camera view: HUD over the camera (native below on iOS, synthetic in the simulator) */
      #hud {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        z-index: 2;
        pointer-events: none;
      }
      #hud[hidden] {
        display: none;
      }
      body.face-corner #face {
        position: fixed;
        right: max(12px, env(safe-area-inset-right));
        bottom: max(12px, env(safe-area-inset-bottom));
        width: 32vw;
        height: 32vh;
        border-radius: 16px;
        z-index: 3;
      }
      /* iOS draws web pages natively below this view */
      body.native-web,
      body.native-web #display {
        background: transparent;
      }
      /* display.subtitle: newest three lines, on top of everything */
      #subtitles {
        position: fixed;
        left: 50%;
        bottom: max(16px, env(safe-area-inset-bottom));
        transform: translateX(-50%);
        z-index: 4;
        box-sizing: border-box;
        width: max-content;
        max-width: min(92vw, 1200px);
        padding: 0.35em 0.8em;
        border-radius: 0.5em;
        background: rgba(0, 0, 0, 0.66);
        color: #fff;
        font: 600 clamp(16px, 6.2vh, 44px) / 1.3 "Inter Variable", system-ui, sans-serif;
        text-align: center;
      }
      #subtitles[hidden] {
        display: none;
      }
      #subtitles[data-position="top"] {
        top: max(16px, env(safe-area-inset-top));
        bottom: auto;
      }
      #subtitles > div {
        max-height: calc(3 * 1.3em);
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        overflow: hidden;
      }
      #subtitles p {
        flex-shrink: 0;
        margin: 0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <canvas id="face"></canvas>
    <div id="display" hidden></div>
    <canvas id="hud" hidden></canvas>
    <div id="subtitles" hidden><div><p></p></div></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
